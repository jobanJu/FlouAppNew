name: Supabase deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (optional)
        run: |
          # install node if needed for any scripts
          sudo apt-get update && sudo apt-get install -y curl

      - name: Install Supabase CLI
        run: |
          echo "Detecting architecture"
          ARCH="$(uname -m)"
          ASSET="linux_amd64"
          if [ "$ARCH" = "aarch64" ]; then ASSET="linux_arm64"; fi
          echo "Arch: $ARCH -> asset: $ASSET"

          echo "Ensure jq is installed for reliable JSON parsing"
          sudo apt-get update && sudo apt-get install -y jq

          echo "Fetching latest Supabase CLI release info"
          RELEASE_JSON=$(curl -fsSL https://api.github.com/repos/supabase/cli/releases/latest) || { echo "Failed to fetch release info"; exit 2; }

          echo "Locating .deb asset for asset: $ASSET"
          URL=$(echo "$RELEASE_JSON" | jq -r --arg asset "$ASSET" '.assets[] | select(.name | test($asset + ".*\\.deb")) | .browser_download_url' | head -n1)

          if [ -z "$URL" ]; then
            echo "No .deb asset found for $ASSET; attempting pkg.tar.zst/tar.gz/rpm"
            URL=$(echo "$RELEASE_JSON" | jq -r --arg asset "$ASSET" '.assets[] | select(.name | test($asset + ".*(pkg\\.tar\\.zst|tar\\.gz|rpm)")) | .browser_download_url' | head -n1)
          fi

          if [ -z "$URL" ]; then
            echo "No pkg/rpm asset found; attempting apk as last resort"
            URL=$(echo "$RELEASE_JSON" | jq -r --arg asset "$ASSET" '.assets[] | select(.name | test($asset + ".*apk")) | .browser_download_url' | head -n1)
          fi

          if [ -z "$URL" ]; then
            echo "ERROR: Could not determine supabase CLI download URL for asset: $ASSET"
            echo "Release JSON (truncated):"
            echo "$RELEASE_JSON" | head -n 200
            exit 3
          fi

          echo "Downloading Supabase CLI from: $URL"
          FILENAME=$(basename "$URL")
          curl -fsSL "$URL" -o "$FILENAME" || { echo "Failed to download $URL"; exit 4; }

          if [[ "$FILENAME" == *.deb ]]; then
            echo "Installing deb package $FILENAME"
            sudo apt-get install -y ./$FILENAME || { echo "Failed to install $FILENAME"; ls -al; exit 6; }
          else
            echo "Attempting to extract archive $FILENAME"
            if [[ "$FILENAME" == *.tar.gz ]] || [[ "$FILENAME" == *.tgz ]]; then
              tar -xzf "$FILENAME" || { echo "Failed to extract $FILENAME"; ls -al; exit 5; }
            elif [[ "$FILENAME" == *.pkg.tar.zst ]]; then
              sudo apt-get install -y zstd || true
              unzstd "$FILENAME" -c | tar -xvf - || { echo "Failed to extract $FILENAME"; ls -al; exit 5; }
            else
              echo "Unknown archive format for $FILENAME, listing directory for debugging"; ls -al; exit 7
            fi
            sudo mv supabase /usr/local/bin/ || { echo "Failed to move supabase binary to /usr/local/bin"; ls -al; exit 6; }
          fi
          rm -f "$FILENAME"

      - name: Apply DB schema (migrations)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Logging into Supabase CLI and linking project $SUPABASE_PROJECT_REF"
          supabase login --access-token "$SUPABASE_ACCESS_TOKEN" || true
          supabase link --project-ref "$SUPABASE_PROJECT_REF" || true
          echo "Applying DB schema to project $SUPABASE_PROJECT_REF"
          supabase db push

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          echo "Deploying functions from supabase/functions"
          if [ -d "supabase/functions" ]; then
            for d in supabase/functions/*/ ; do
              fn=$(basename "$d")
              echo "Deploying function: $fn"
              supabase functions deploy "$fn"
            done
          else
            echo "No functions directory found, skipping."
          fi

      - name: Smoke check (optional)
        run: |
          echo "Deployment finished"
