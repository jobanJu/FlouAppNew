name: Supabase manual deploy

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update && sudo apt-get install -y curl jq

      - name: Install Supabase CLI
        run: |
          ARCH="$(uname -m)"
          ASSET="linux_amd64"
          if [ "$ARCH" = "aarch64" ]; then ASSET="linux_arm64"; fi
          RELEASE_JSON=$(curl -fsSL https://api.github.com/repos/supabase/cli/releases/latest)
          URL=$(echo "$RELEASE_JSON" | jq -r --arg asset "$ASSET" '.assets[] | select(.name | test($asset + ".*\\.deb")) | .browser_download_url' | head -n1)
          if [ -z "$URL" ]; then
            URL=$(echo "$RELEASE_JSON" | jq -r --arg asset "$ASSET" '.assets[] | select(.name | test($asset + ".*(pkg\\.tar\\.zst|tar\\.gz|rpm)")) | .browser_download_url' | head -n1)
          fi
          if [ -z "$URL" ]; then echo "Unable to find supabase CLI asset"; exit 2; fi
          FILENAME=$(basename "$URL")
          curl -fsSL "$URL" -o "$FILENAME"
          if [[ "$FILENAME" == *.deb ]]; then sudo apt-get install -y ./$FILENAME; else tar -xzf "$FILENAME" || true; sudo mv supabase /usr/local/bin/ || true; fi
          rm -f "$FILENAME"

      - name: Login & link project
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF; set them in repo secrets."; exit 1
          fi
          supabase login --token "$SUPABASE_ACCESS_TOKEN" || true
          supabase link --project-ref "$SUPABASE_PROJECT_REF" || true

      - name: Apply DB schema (db push)
        run: |
          echo "Applying DB schema"
          supabase db push

      - name: Deploy Edge Functions
        run: |
          if [ -d "supabase/functions" ]; then
            for d in supabase/functions/*/; do
              [ -d "$d" ] || continue
              fn=$(basename "$d")
              echo "Deploying function: $fn"
              supabase functions deploy "$fn" || true
            done
          else
            echo "No functions to deploy"
          fi

      - name: Finished
        run: echo "Supabase deploy job finished"
