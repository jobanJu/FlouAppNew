<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flou - Rencontres</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
    }

    .logo-container {
      margin-bottom: 40px;
    }

    .logo-container img {
      max-width: 150px;
      height: auto;
    }

    .hero-content {
      text-align: center;
      color: white;
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }

    .hero-content h1 {
      font-size: clamp(2.5rem, 8vw, 3.5rem);
      font-weight: 700;
      margin: 0 0 15px 0;
    }

    .hero-content p {
      font-size: clamp(1.2rem, 3vw, 1.5rem);
      opacity: 0.95;
      margin: 0 0 50px 0;
      line-height: 1.6;
      font-weight: 500;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
    }

    .btn {
      padding: 14px 32px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
    }

    .btn-secondary {
      background: transparent;
      color: white;
      border: 2px solid white;
    }

    .btn-secondary:hover {
      background: white;
      color: #000000;
      transform: translateY(-2px);
    }

    @media (max-width: 640px) {
      .hero-content {
        padding: 20px;
      }

      .logo-container {
        margin-bottom: 30px;
      }

      .hero-content h1 {
        font-size: 2rem;
      }

      .hero-content p {
        font-size: 1rem;
        margin-bottom: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="hero">
    <!-- Logo -->
    <div class="logo-container">
      <img src="./assets/logos/logo3.png" alt="Flou Logo" onerror="this.style.display='none'">
    </div>

    <!-- Content -->
    <div class="hero-content">
      <p>Et si l'essentiel se révélait avant le visage ?</p>
      
      <!-- Buttons -->
      <div class="button-group">
        <button class="btn btn-primary" onclick="startApp()">
          Commencer
        </button>
        <button class="btn btn-secondary" onclick="login()">
          Connexion
        </button>
      </div>
    </div>
  </div>

  <script>
    function startApp() {
      alert('Fonctionnalité à venir');
    }

    function login() {
      alert('Fonctionnalité à venir');
    }
  </script>
</body>
</html>
