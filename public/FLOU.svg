<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond dégradé violet -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#581c87;stop-opacity:1" />
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="90" fill="url(#grad1)"/>
  
  <!-- Effet de flou symbolique - cercles flous -->
  <circle cx="180" cy="200" r="60" fill="#ffffff" opacity="0.15" filter="url(#blur1)"/>
  <circle cx="330" cy="220" r="50" fill="#ffffff" opacity="0.2" filter="url(#blur1)"/>
  
  <!-- Texte FLOU stylisé -->
  <text x="256" y="280" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.9">FLOU</text>
  
  <!-- Coeur/emoji symbolique -->
  <text x="256" y="390" font-size="80" text-anchor="middle">💜</text>
</svg>
