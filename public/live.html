<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flou - Live Streaming</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/assets/css/live-styles.css">
</head>
<body>
    <div class="live-container">
        <!-- VIDEO SECTION -->
        <div class="video-grid" id="videoGrid"></div>

        <!-- HEADER -->
        <header class="live-header">
            <div class="live-badge">
                <span class="live-dot"></span>
                <span>EN DIRECT</span>
            </div>
        </header>

        <!-- TOP-RIGHT STATS -->
        <div class="viewers-card">
            <i class="bi bi-eye-fill"></i>
            <div class="stats">
                <div class="viewers-count" id="viewerCount">0</div>
                <div class="viewers-label">viewers</div>
            </div>
        </div>

        <!-- REQUEST CAMERA BUTTON -->
        <button class="request-camera-btn" id="requestCameraBtn" title="Demander la caméra (Max 3)">
            <i class="bi bi-plus-lg"></i>
        </button>

        <!-- STREAMER INFO -->
        <aside class="streamer-info">
            <div class="avatar">JD</div>
            <div class="info">
                <h3>Julia D.</h3>
                <p>📍 Paris • 24 ans</p>
            </div>
            <button class="btn btn-follow" onclick="toggleFollow(event)">Suivre</button>
        </aside>

        <!-- CONTROLS -->
        <div class="controls">
            <button class="btn btn-icon" onclick="toggleHeart()" title="J'aime">
                <i class="bi bi-heart"></i>
            </button>
            <button class="btn btn-icon" onclick="showGiftModal()" title="Cadeau">
                <i class="bi bi-gift"></i>
            </button>
            <button class="btn btn-icon" onclick="shareStream()" title="Partager">
                <i class="bi bi-share"></i>
            </button>
            <button class="btn btn-icon" onclick="toggleChat()" title="Chat">
                <i class="bi bi-chat-dots"></i>
            </button>
            <button class="btn btn-icon btn-close" onclick="closeLive()" title="Fermer">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>

        <!-- CHAT PANEL -->
        <aside class="chat-panel" id="chatPanel">
            <header class="chat-header">
                <span>Chat en direct</span>
                <button class="btn-close-chat" onclick="toggleChat()">
                    <i class="bi bi-x-lg"></i>
                </button>
            </header>
            <div class="chat-messages" id="chatMessages"></div>
            <footer class="chat-footer">
                <input type="text" class="chat-input" id="chatInput" placeholder="Dire quelque chose..." maxlength="200">
                <button class="btn btn-send" onclick="sendMessage()">
                    <i class="bi bi-send"></i>
                </button>
            </footer>
        </aside>

        <!-- GIFT MODAL -->
        <div class="gift-modal" id="giftModal">
            <div class="gift-grid">
                <button class="gift-item" onclick="sendGift('💐')" title="Bouquet">💐</button>
                <button class="gift-item" onclick="sendGift('🎁')" title="Cadeau">🎁</button>
                <button class="gift-item" onclick="sendGift('💎')" title="Diamant">💎</button>
                <button class="gift-item" onclick="sendGift('🌹')" title="Rose">🌹</button>
                <button class="gift-item" onclick="sendGift('🎉')" title="Confettis">🎉</button>
                <button class="gift-item" onclick="sendGift('⭐')" title="Star">⭐</button>
            </div>
        </div>
    </div>

    <!-- VIDEO REQUEST MODAL -->
    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="video-request-modal" id="videoRequestModal">
        <h2 class="modal-title">Demande d'accès caméra</h2>
        <p class="modal-username" id="requestUsername">@Utilisateur</p>
        <div class="modal-buttons">
            <button class="btn btn-accept" onclick="acceptVideoRequest()">Accepter</button>
            <button class="btn btn-decline" onclick="declineVideoRequest()">Refuser</button>
        </div>
    </div>

    <script src="/assets/js/live-video.js"></script>
    <script src="/assets/js/live-chat.js"></script>
    <script src="/assets/js/live-controls.js"></script>
</body>
</html>
